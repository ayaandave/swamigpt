<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>You're offline · SwamiGPT</title>
<style>
  html,body{margin:0;min-height:100%;background:#f2e3c6;color:#2b1b10;font-family:-apple-system,system-ui,sans-serif}
  main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center;box-sizing:border-box}
  .lamp{font-size:72px;line-height:1}
  h1{font-family:Georgia,serif;font-weight:400;font-size:34px;margin:18px 0 8px}
  p{max-width:30ch;font-size:19px;line-height:1.5;color:#5a4330;margin:0}
  button{margin-top:28px;min-height:52px;padding:0 28px;border:0;border-radius:999px;background:#d9741a;color:#2b1b10;font-size:18px;font-weight:700}
</style>
</head>
<body>
<main>
  <div class="lamp" aria-hidden="true">🪔</div>
  <h1>You're offline</h1>
  <p>The lamp is still lit. Take a slow breath while your connection comes back. Pages you've opened before will still work.</p>
  <button type="button" onclick="location.href='https://www.swamigpt.com/'">Try again</button>
</main>
</body>
</html>
